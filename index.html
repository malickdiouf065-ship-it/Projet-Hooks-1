<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Netflix Clone - Mes Films</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Helvetica Neue', Arial, sans-serif;
    background: #141414;
    color: #fff;
    min-height: 100vh;
  }
  .navbar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 40px;
    background: linear-gradient(180deg, #000 0%, rgba(20,20,20,0.9) 100%);
    backdrop-filter: blur(10px);
    box-shadow: 0 2px 20px rgba(0,0,0,0.5);
  }
  .logo {
    color: #e50914;
    font-size: 32px;
    font-weight: 900;
    letter-spacing: -2px;
    text-transform: uppercase;
    text-shadow: 0 0 20px rgba(229,9,20,0.3);
  }
  .logo span { color: #fff; }
  .container { padding: 30px 40px 80px; max-width: 1600px; margin: 0 auto; }

  /* Filters */
  .filters {
    display: flex;
    gap: 15px;
    margin-bottom: 30px;
    flex-wrap: wrap;
    align-items: center;
  }
  .filters input {
    padding: 12px 18px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #1f1f1f;
    color: #fff;
    font-size: 14px;
    min-width: 250px;
    transition: all 0.3s;
  }
  .filters input:focus {
    outline: none;
    border-color: #e50914;
    box-shadow: 0 0 0 3px rgba(229,9,20,0.2);
  }
  .filters select {
    padding: 12px 18px;
    border-radius: 6px;
    border: 1px solid #333;
    background: #1f1f1f;
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }
  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 6px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.25s;
    font-family: inherit;
  }
  .btn-primary {
    background: #e50914;
    color: #fff;
  }
  .btn-primary:hover {
    background: #f6121d;
    transform: translateY(-1px);
    box-shadow: 0 4px 15px rgba(229,9,20,0.4);
  }
  .btn-secondary {
    background: #333;
    color: #fff;
  }
  .btn-secondary:hover { background: #444; }
  .btn-danger {
    background: transparent;
    color: #fff;
    border: 1px solid #555;
  }
  .btn-danger:hover {
    background: #e50914;
    border-color: #e50914;
  }
  .btn-edit {
    background: #fff;
    color: #000;
  }
  .btn-edit:hover { background: #e6e6e6; }

  /* Movie Grid */
  .movie-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 22px;
  }
  .movie-card {
    position: relative;
    border-radius: 8px;
    overflow: hidden;
    background: #1f1f1f;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    aspect-ratio: 2/3;
  }
  .movie-card:hover {
    transform: scale(1.05);
    box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    z-index: 10;
  }
  .movie-card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }
  .movie-card .no-poster {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #555;
    font-size: 14px;
    background: linear-gradient(135deg, #1f1f1f, #2a2a2a);
  }
  .movie-overlay {
    position: absolute;
    inset: 0;
    background: linear-gradient(0deg, rgba(0,0,0,0.95) 0%, rgba(0,0,0,0.6) 40%, transparent 100%);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    padding: 15px;
    opacity: 0;
    transition: opacity 0.3s;
  }
  .movie-card:hover .movie-overlay { opacity: 1; }
  .movie-overlay h3 {
    font-size: 15px;
    margin-bottom: 6px;
    line-height: 1.3;
  }
  .movie-overlay p {
    font-size: 12px;
    color: #bbb;
    margin-bottom: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .rating {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    background: #e50914;
    padding: 3px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 8px;
    width: fit-content;
  }
  .movie-actions {
    display: flex;
    gap: 6px;
  }
  .movie-actions button {
    flex: 1;
    padding: 6px 8px;
    font-size: 11px;
    border-radius: 4px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
  }

  /* Modal */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    animation: fadeIn 0.25s;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    background: #181818;
    border-radius: 10px;
    width: 100%;
    max-width: 520px;
    padding: 30px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.9);
    max-height: 90vh;
    overflow-y: auto;
    animation: slideUp 0.3s;
  }
  @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal h2 {
    margin-bottom: 22px;
    font-size: 22px;
  }
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    color: #bbb;
    font-weight: 500;
  }
  .form-group input,
  .form-group textarea {
    width: 100%;
    padding: 11px 14px;
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    color: #fff;
    border-radius: 5px;
    font-size: 14px;
    font-family: inherit;
    transition: all 0.2s;
  }
  .form-group input:focus,
  .form-group textarea:focus {
    outline: none;
    border-color: #e50914;
    background: #2f2f2f;
  }
  .form-group textarea {
    resize: vertical;
    min-height: 80px;
  }
  .form-actions {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
    margin-top: 24px;
  }
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: #666;
  }
  .empty-state h3 { font-size: 20px; margin-bottom: 10px; color: #888; }
  .empty-state p { font-size: 14px; }

  @media (max-width: 640px) {
    .container { padding: 20px; }
    .navbar { padding: 14px 20px; }
    .logo { font-size: 24px; }
    .movie-grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
    .filters input { min-width: unset; flex: 1; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useMemo } = React;

// ==== Données initiales ====
const INITIAL_MOVIES = [
  {
    id: 1,
    titre: "Stranger Things",
    description: "Quand un jeune garçon disparaît, une petite ville découvre une affaire mystérieuse, des expériences secrètes et une fillette étrange.",
    poster: "https://image.tmdb.org/t/p/w500/49WJfeN0moxb9IPfGn8AIqMGskD.jpg",
    note: 8.7
  },
  {
    id: 2,
    titre: "Breaking Bad",
    description: "Un professeur de chimie atteint d'un cancer s'associe à un ancien élève pour fabriquer de la méthamphétamine.",
    poster: "https://image.tmdb.org/t/p/w500/ggFHVNu6YYI5L9pCfOacjizRGt.jpg",
    note: 9.5
  },
  {
    id: 3,
    titre: "The Witcher",
    description: "Geralt de Riv, chasseur de monstres, lutte pour trouver sa place dans un monde où les humains sont plus cruels que les bêtes.",
    poster: "https://image.tmdb.org/t/p/w500/7vjaCdMw15FEbXyLcQ1vC2GcGIf.jpg",
    note: 8.2
  },
  {
    id: 4,
    titre: "Dark",
    description: "Une série qui explore les secrets d'une famille, la disparition d'enfants et le voyage dans le temps dans une ville allemande.",
    poster: "https://image.tmdb.org/t/p/w500/apbrbWs8M9lyOpJYU5WXrpFbk1Z.jpg",
    note: 8.8
  },
  {
    id: 5,
    titre: "Interstellar",
    description: "Un groupe d'explorateurs utilise un trou de ver pour voyager à travers l'univers et assurer la survie de l'humanité.",
    poster: "https://image.tmdb.org/t/p/w500/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg",
    note: 8.7
  },
  {
    id: 6,
    titre: "Inception",
    description: "Un voleur expérimenté dans l'art de l'extraction de secrets se voit confier la mission inverse : implanter une idée.",
    poster: "https://image.tmdb.org/t/p/w500/9gk7adHYeDvHkCSEqAvQNLV5Uge.jpg",
    note: 8.8
  }
];

// ==== Composant Carte de film ====
function MovieCard({ movie, onEdit, onDelete }) {
  return (
    <div className="movie-card">
      {movie.poster ? (
        <img src={movie.poster} alt={movie.titre} onError={(e) => { e.target.style.display='none'; }}/>
      ) : (
        <div className="no-poster">Pas d'affiche</div>
      )}
      <div className="movie-overlay">
        <h3>{movie.titre}</h3>
        <p>{movie.description}</p>
        <div className="rating">⭐ {movie.note}/10</div>
        <div className="movie-actions">
          <button className="btn-edit" onClick={() => onEdit(movie)}>Modifier</button>
          <button className="btn-danger" onClick={() => onDelete(movie.id)}>Supprimer</button>
        </div>
      </div>
    </div>
  );
}

// ==== Composant Liste de films ====
function MovieList({ movies, onEdit, onDelete }) {
  if (movies.length === 0) {
    return (
      <div className="empty-state">
        <h3>Aucun film trouvé</h3>
        <p>Ajoutez un film ou modifiez vos filtres.</p>
      </div>
    );
  }
  return (
    <div className="movie-grid">
      {movies.map(m => (
        <MovieCard key={m.id} movie={m} onEdit={onEdit} onDelete={onDelete} />
      ))}
    </div>
  );
}

// ==== Composant Filtres ====
function Filters({ titleFilter, setTitleFilter, ratingFilter, setRatingFilter }) {
  return (
    <div className="filters">
      <input
        type="text"
        placeholder="🔍 Filtrer par titre..."
        value={titleFilter}
        onChange={(e) => setTitleFilter(e.target.value)}
      />
      <select value={ratingFilter} onChange={(e) => setRatingFilter(e.target.value)}>
        <option value="all">Toutes les notes</option>
        <option value="9">⭐ 9+</option>
        <option value="8">⭐ 8+</option>
        <option value="7">⭐ 7+</option>
        <option value="6">⭐ 6+</option>
        <option value="5">⭐ 5+</option>
      </select>
    </div>
  );
}

// ==== Formulaire Modal (Ajout / Édition) ====
function MovieForm({ isOpen, onClose, onSave, editingMovie }) {
  const [form, setForm] = useState({ titre: "", description: "", poster: "", note: "" });

  useEffect(() => {
    if (isOpen) {
      if (editingMovie) {
        setForm({
          titre: editingMovie.titre,
          description: editingMovie.description,
          poster: editingMovie.poster || "",
          note: editingMovie.note
        });
      } else {
        setForm({ titre: "", description: "", poster: "", note: "" });
      }
    }
  }, [isOpen, editingMovie]);

  if (!isOpen) return null;

  const handleSubmit = (e) => {
    e.preventDefault();
    if (!form.titre.trim()) return;
    const note = parseFloat(form.note);
    onSave({
      titre: form.titre.trim(),
      description: form.description.trim(),
      poster: form.poster.trim(),
      note: isNaN(note) ? 0 : Math.min(10, Math.max(0, note))
    });
  };

  return (
    <div className="modal-backdrop" onClick={onClose}>
      <div className="modal" onClick={(e) => e.stopPropagation()}>
        <h2>{editingMovie ? "✏️ Modifier le film" : "➕ Ajouter un film"}</h2>
        <form onSubmit={handleSubmit}>
          <div className="form-group">
            <label>Titre *</label>
            <input
              type="text"
              value={form.titre}
              onChange={(e) => setForm({...form, titre: e.target.value})}
              required
              placeholder="Ex: The Witcher"
            />
          </div>
          <div className="form-group">
            <label>Description</label>
            <textarea
              value={form.description}
              onChange={(e) => setForm({...form, description: e.target.value})}
              placeholder="Résumé du film..."
            />
          </div>
          <div className="form-group">
            <label>URL de l'affiche</label>
            <input
              type="url"
              value={form.poster}
              onChange={(e) => setForm({...form, poster: e.target.value})}
              placeholder="https://..."
            />
          </div>
          <div className="form-group">
            <label>Note (sur 10)</label>
            <input
              type="number"
              min="0"
              max="10"
              step="0.1"
              value={form.note}
              onChange={(e) => setForm({...form, note: e.target.value})}
              placeholder="8.5"
            />
          </div>
          <div className="form-actions">
            <button type="button" className="btn btn-secondary" onClick={onClose}>Annuler</button>
            <button type="submit" className="btn btn-primary">
              {editingMovie ? "Enregistrer" : "Ajouter"}
            </button>
          </div>
        </form>
      </div>
    </div>
  );
}

// ==== Application principale ====
function App() {
  const [movies, setMovies] = useState([]);
  const [titleFilter, setTitleFilter] = useState("");
  const [ratingFilter, setRatingFilter] = useState("all");
  const [isFormOpen, setIsFormOpen] = useState(false);
  const [editingMovie, setEditingMovie] = useState(null);
  const [loaded, setLoaded] = useState(false);

  // Chargement initial depuis localStorage
  useEffect(() => {
    const saved = localStorage.getItem("movies_app");
    if (saved) {
      try {
        setMovies(JSON.parse(saved));
      } catch (e) {
        setMovies(INITIAL_MOVIES);
      }
    } else {
      setMovies(INITIAL_MOVIES);
    }
    setLoaded(true);
  }, []);

  // Sauvegarde à chaque changement
  useEffect(() => {
    if (loaded) {
      localStorage.setItem("movies_app", JSON.stringify(movies));
    }
  }, [movies, loaded]);

  // Filtrage
  const filteredMovies = useMemo(() => {
    return movies.filter(m => {
      const matchTitle = m.titre.toLowerCase().includes(titleFilter.toLowerCase());
      const matchRating = ratingFilter === "all" || m.note >= parseFloat(ratingFilter);
      return matchTitle && matchRating;
    });
  }, [movies, titleFilter, ratingFilter]);

  const handleSave = (data) => {
    if (editingMovie) {
      setMovies(prev => prev.map(m => m.id === editingMovie.id ? { ...m, ...data } : m));
    } else {
      const newId = Date.now();
      setMovies(prev => [...prev, { id: newId, ...data }]);
    }
    setIsFormOpen(false);
    setEditingMovie(null);
  };

  const handleEdit = (movie) => {
    setEditingMovie(movie);
    setIsFormOpen(true);
  };

  const handleDelete = (id) => {
    if (window.confirm("Supprimer ce film ?")) {
      setMovies(prev => prev.filter(m => m.id !== id));
    }
  };

  const handleAdd = () => {
    setEditingMovie(null);
    setIsFormOpen(true);
  };

  return (
    <>
      <nav className="navbar">
        <div className="logo">CINE<span>STREAM</span></div>
        <button className="btn btn-primary" onClick={handleAdd}>+ Ajouter</button>
      </nav>

      <div className="container">
        <Filters
          titleFilter={titleFilter}
          setTitleFilter={setTitleFilter}
          ratingFilter={ratingFilter}
          setRatingFilter={setRatingFilter}
        />

        <MovieList movies={filteredMovies} onEdit={handleEdit} onDelete={handleDelete} />
      </div>

      <MovieForm
        isOpen={isFormOpen}
        onClose={() => { setIsFormOpen(false); setEditingMovie(null); }}
        onSave={handleSave}
        editingMovie={editingMovie}
      />
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
